; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; [env:seeed_xiao_esp32_c6]
[env:pot]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino

upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*
monitor_speed = 115200

build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -D POT_MACHINE
build_src_filter = -<*> +<pot/>
check_src_filters = 
	src/
	lib/
	include/

[env:server]
platform = espressif32
board = esp32dev
framework = arduino

upload_port = /dev/ttyUSB*
monitor_port = /dev/ttyUSB*
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600

build_flags = -D SERVER_MACHINE -std=gnu++17
board_build.filesystem = littlefs
build_src_filter = -<*> +<server/> +<webserver/>
check_src_filters = 
	src/
	lib/
	include/
lib_deps = bblanchon/ArduinoJson@^7.4.3


[env:potC3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*
monitor_speed = 115200

build_flags = -D_GNU_SOURCE -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1 -D POT_MACHINE -D C3_MACHINE
build_src_filter = -<*> +<pot/>
check_src_filters = 
	src/
	lib/
	include/
lib_deps = 
